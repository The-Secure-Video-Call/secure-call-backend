# Paste this into Nginx Proxy Manager: the signal.securevideocall.com proxy host, Edit, Advanced
# tab, "Custom Nginx Configuration" (README.md, setup step 4). In the SSL tab, "Force SSL" and
# "HSTS Enabled" must be OFF: these lines replace both. Add no Custom Locations to this host:
# their responses would carry the security headers twice. CI runs these exact lines in an nginx
# server block built like Nginx Proxy Manager's, against the real backend container.

# No record of who connected when (PLAN.md 3.5).
access_log off;

# Plain HTTP gets an error, not a redirect (#56): a client that wrongly uses http:// or ws:// is
# noticed instead of being silently fixed. Let's Encrypt's challenge is the one exception, so the
# proxy can still renew the certificate. ("Force SSL" would redirect before these lines run.)
set $refuse_plain_http "";
if ($scheme = "http") {
  set $refuse_plain_http "1";
}
if ($uri ~ "^/\.well-known/acme-challenge/") {
  set $refuse_plain_http "";
}
if ($refuse_plain_http) {
  return 400;
}

# The backend's security headers on the responses the proxy makes itself (#61): the error above,
# 405 for TRACE, any other nginx error page. "always" adds them to error responses. They must
# equal what the backend sends (tests/test_proxy_headers.py checks that). Proxied responses keep
# the backend's own copy, exactly once: Nginx Proxy Manager's location block sets an add_header of
# its own (X-Served-By), so nginx does not add these server-level ones there. Hiding the backend's
# copies would therefore strip them, so they are not hidden. A 502 or 504 made inside that
# location (the backend down, or its certificate refused) would carry none of them, so those two
# are answered from the named locations below, which do.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=()" always;
# The proxy's own HTML pages declare their encoding.
charset utf-8;
error_page 502 @proxy_502;
error_page 504 @proxy_504;
location @proxy_502 {
  return 502;
}
location @proxy_504 {
  return 504;
}

# The hop to the backend: TLS 1.3 only, and its certificate checked against our own CA under the
# name it carries (it need not resolve). Without proxy_ssl_verify the hop would be encrypted but
# anyone on the home network could pose as the backend.
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /data/secure-call/local-ca.crt;
proxy_ssl_name secure-call-backend;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.3;
