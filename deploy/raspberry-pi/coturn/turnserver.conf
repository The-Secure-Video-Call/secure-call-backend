# Hardened coturn for the Secure Call TURN relay (PLAN.md 3.5, section 7 M3).
# Mounted read-only into the container by compose.yaml. Nothing secret or machine-specific
# is in this file: static-auth-secret is passed on the command line from TURN_SHARED_SECRET
# (see compose.yaml).

# --- Authentication: short-lived HMAC (REST) credentials only --------------------------
use-auth-secret
# static-auth-secret is deliberately NOT set here.
realm=securevideocall.com
fingerprint
stale-nonce
# No static users (never add "user=" lines), no user database, no admin CLI.
no-cli

# --- Ports -----------------------------------------------------------------------------
# compose.yaml passes --listening-ip for the container's own address (172.30.200.2) and
# 127.0.0.1 only, so coturn does not listen on every interface.
listening-port=3478
# RFC 5780 NAT behaviour discovery needs two public IPs and WebRTC does not use it: turn it off.
no-rfc5780
# The root filesystem is read-only; /var/tmp is a small tmpfs (compose.yaml).
pidfile=/var/tmp/turnserver.pid
# No TURN over TLS/DTLS yet (out of scope): no tls-listening-port, cert or pkey.
no-tls
no-dtls
min-port=49160
max-port=49200

# --- IPv4-only relays ------------------------------------------------------------------
# Relays are bound to one IPv4 address only: compose.yaml passes --relay-ip=172.30.200.2
# (the container's address on its IPv6-less Docker network). With no IPv6 relay address, a request for an IPv6 relay is answered
# with 440 (Address Family not Supported), so a credential holder can never reach home devices
# through a global IPv6 address that no deny range below covers. This line makes IPv4 the
# default family when a client does not ask for one.
allocation-default-address-family=ipv4

# --- Never relay into private networks (most important section) ------------------------
# Without these, anyone holding a credential could reach the home LAN through the relay.
no-multicast-peers
# compose.yaml adds one more deny on the command line: --denied-peer-ip=<TURN_PUBLIC_IP>.
# coturn 4.6.3 does not know "no-loopback-peers" (it logs "Bad configuration format"), so it is
# not set. Loopback is denied by the explicit ranges below (127.0.0.0/8, ::1 and the mapped
# form); the CI test proves it.
# Starts at 0.0.0.1, never at 0.0.0.0: a range whose min is the "any" address may match everything.
denied-peer-ip=0.0.0.1-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# IPv6: loopback, unique local (fc00::/7), link local (fe80::/10)
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# No range may start at 0.0.0.0 or :: (see above). The unspecified address is not denied
# explicitly: it is not a usable peer.
# IPv4-mapped IPv6 forms of ONLY the private/reserved IPv4 ranges above, so a private address
# cannot be smuggled in as ::ffff:192.168.x.x. Do NOT deny ::ffff:0.0.0.0-::ffff:255.255.255.255:
# coturn matches IPv4 peers against the mapped range too, so that line refuses every public
# IPv4 peer (found by the first CI run: 403 Forbidden IP for 8.8.8.8).
denied-peer-ip=::ffff:0.0.0.1-::ffff:0.255.255.255
denied-peer-ip=::ffff:10.0.0.0-::ffff:10.255.255.255
denied-peer-ip=::ffff:100.64.0.0-::ffff:100.127.255.255
denied-peer-ip=::ffff:127.0.0.0-::ffff:127.255.255.255
denied-peer-ip=::ffff:169.254.0.0-::ffff:169.254.255.255
denied-peer-ip=::ffff:172.16.0.0-::ffff:172.31.255.255
denied-peer-ip=::ffff:192.0.0.0-::ffff:192.0.0.255
denied-peer-ip=::ffff:192.168.0.0-::ffff:192.168.255.255
denied-peer-ip=::ffff:198.18.0.0-::ffff:198.19.255.255
denied-peer-ip=::ffff:240.0.0.0-::ffff:255.255.255.255
# Extra: site-local IPv6, and NAT64 / 6to4 which can embed private IPv4 addresses.
denied-peer-ip=fec0::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# TCP relaying (RFC 6062) is not needed for WebRTC; it only adds attack surface.
no-tcp-relay

# --- Quotas, sized for a 200 Mbit/s home connection -------------------------------------
# Allocations per username, and in total.
# Usernames are per join, so this is NOT a per-client limit: every credential has a new username,
# and one client with about 7 credentials (41 relay ports / 6) can fill the relay (issue #37).
# The backend's per-IP and per-room credential caps are the only brake on that; see the README's
# "What one client can still do". The number is reasoned, not measured: a browser makes one
# allocation per TURN URL (UDP and TCP) per network interface it uses, so 2 on one interface,
# and an ICE restart briefly doubles that to 4 before the old ones are closed. 6 is that plus
# a margin of 2; 4 would leave no margin for a restart. A phone using Wi-Fi and mobile data at
# once could need 8 in a restart; the extra allocations would get 486 (the ones that worked stay).
user-quota=6
total-quota=100
# Longest a single Allocate/Refresh may ask for. Explicit (not coturn's default of 3600) so the
# value is ours: a client must refresh every 10 minutes. This does NOT cap the total life of an
# allocation, because a client may keep refreshing. coturn 4.6.3 has no option to refuse a
# Refresh after the REST credential has expired or to cap an allocation's total life; the CI
# probe (refresh_after_expiry.py) shows what it does, and test-coturn.sh pins that result.
max-allocate-lifetime=600
# Per session, bytes per second: 500000 B/s = 4 Mbit/s, enough for a 720p call with margin.
max-bps=500000
# Whole-server relay cap: 18750000 B/s = 150 Mbit/s (75% of the line), so a busy relay
# cannot starve the household or the backend.
bps-capacity=18750000

# --- Logging: none ---------------------------------------------------------------------
# Session log lines can contain usernames and peer IPs, which must never be logged
# (PLAN.md section 3). CI found that log-file=/dev/null still produced
# /var/tmp/turn_<pid>_<date>.log (coturn builds a dated file name from the setting, so
# /dev/null is not a special case). "stdout" is a special name that opens no file; together with
# no-stdout-log, nothing is written. compose.yaml also makes the root filesystem read-only with
# small tmpfs mounts, so even a file coturn does create never reaches the Pi's disk.
# Never enable "verbose" or "Verbose".
no-stdout-log
log-file=stdout
simple-log
no-software-attribute
