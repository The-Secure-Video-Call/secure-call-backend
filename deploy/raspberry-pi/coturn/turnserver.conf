# Hardened coturn for the Secure Call TURN relay (PLAN.md 3.5, section 7 M3).
# Mounted read-only into the container by compose.yaml. Nothing secret or machine-specific
# is in this file: static-auth-secret is passed on the command line from TURN_SHARED_SECRET
# (see compose.yaml).

# --- Authentication: short-lived HMAC (REST) credentials only --------------------------
use-auth-secret
# static-auth-secret is deliberately NOT set here.
realm=securevideocall.com
fingerprint
stale-nonce
# No static users (never add "user=" lines), no user database, no admin CLI.
no-cli

# --- Ports -----------------------------------------------------------------------------
listening-port=3478
# No TURN over TLS/DTLS yet (out of scope): no tls-listening-port, cert or pkey.
no-tls
no-dtls
min-port=49160
max-port=49200

# --- Never relay into private networks (most important section) ------------------------
# Without these, anyone holding a credential could reach the home LAN through the relay.
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
# IPv6: loopback, unique local (fc00::/7), link local (fe80::/10)
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Extra: the unspecified address, and IPv4-mapped IPv6 so a private IPv4 address cannot be
# smuggled in as ::ffff:192.168.x.x.
denied-peer-ip=::
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
# Extra: site-local IPv6, and NAT64 / 6to4 which can embed private IPv4 addresses.
denied-peer-ip=fec0::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# TCP relaying (RFC 6062) is not needed for WebRTC; it only adds attack surface.
no-tcp-relay

# --- Quotas, sized for a 200 Mbit/s home connection -------------------------------------
# Allocations per username, and in total.
user-quota=12
total-quota=100
# Per session, bytes per second: 500000 B/s = 4 Mbit/s, enough for a 720p call with margin.
max-bps=500000
# Whole-server relay cap: 18750000 B/s = 150 Mbit/s (75% of the line), so a busy relay
# cannot starve the household or the backend.
bps-capacity=18750000

# --- Logging: minimal ------------------------------------------------------------------
# Never enable "verbose" or "Verbose": they log usernames together with client IPs.
# Session lines at the default level may still contain usernames and peer IPs, so
# compose.yaml keeps only a small, rotated Docker log and test-coturn.sh checks the output.
log-file=stdout
simple-log
no-software-attribute
