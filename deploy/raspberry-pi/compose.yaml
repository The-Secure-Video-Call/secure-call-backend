# Backend + PostgreSQL for the Raspberry Pi test server, behind Nginx Proxy Manager.
#
# On the Pi, in this folder:
#   cp .env.example .env      # then fill in the values marked "set"
#   docker compose up -d
# and add update.sh to cron (see README.md) so new images are picked up automatically.
#
# Network layout:
#   - The backend is published on BACKEND_PUBLISH_ADDR:BACKEND_PUBLISH_PORT (default
#     127.0.0.1:8001). Nginx Proxy Manager forwards signal.securevideocall.com there; when the
#     proxy runs on another machine, set BACKEND_PUBLISH_ADDR to this Pi's home-network IP.
#     Never forward this port on your router: only the proxy's 80 and 443 face the internet.
#   - "internal" holds the backend and PostgreSQL.
#   - PostgreSQL is published on POSTGRES_PUBLISH_ADDR:POSTGRES_PUBLISH_PORT (default
#     127.0.0.1:5434, the Pi only) for database tools. Never forward that port, 5432 or 81
#     (the proxy's admin page) on your router.
services:
  backend:
    image: ghcr.io/the-secure-video-call/secure-call-backend:main
    container_name: secure-call-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database is reached by its service name and its own port,
      # whatever port is published on the Pi.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BACKEND_PUBLISH_ADDR:-127.0.0.1}:${BACKEND_PUBLISH_PORT:-8001}:8000'
    networks:
      - internal

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securecall}
      POSTGRES_USER: ${POSTGRES_USER:-securecall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PUBLISH_ADDR:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal: {}

volumes:
  pgdata:
