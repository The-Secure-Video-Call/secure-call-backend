# Backend + PostgreSQL for the Raspberry Pi test server, behind Nginx Proxy Manager.
#
# On the Pi, in this folder:
#   cp .env.example .env      # then fill in the values marked "set"
#   docker compose up -d
# and add update.sh to cron (see README.md) so new images are picked up automatically.
#
# Network layout:
#   - The backend is published on BACKEND_PUBLISH_ADDR:BACKEND_PUBLISH_PORT (default
#     127.0.0.1:8001). Nginx Proxy Manager forwards signal.securevideocall.com there; when the
#     proxy runs on another machine, set BACKEND_PUBLISH_ADDR to this Pi's home-network IP.
#     Never forward this port on your router: only the proxy's 80 and 443 face the internet.
#   - "internal" holds the backend and PostgreSQL.
#   - PostgreSQL is published on POSTGRES_PUBLISH_ADDR:POSTGRES_PUBLISH_PORT (default
#     127.0.0.1:5434, the Pi only) for database tools. Never forward that port, 5432 or 81
#     (the proxy's admin page) on your router.
services:
  backend:
    image: ghcr.io/the-secure-video-call/secure-call-backend:main
    container_name: secure-call-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database is reached by its service name and its own port,
      # whatever port is published on the Pi.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BACKEND_PUBLISH_ADDR:-127.0.0.1}:${BACKEND_PUBLISH_PORT:-8001}:8000'
    networks:
      - internal

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securecall}
      POSTGRES_USER: ${POSTGRES_USER:-securecall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PUBLISH_ADDR:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # TURN relay for calls across NATs (PLAN.md 3.5). Host networking because the relay port
  # range and Docker NAT do not mix. Router forwards: see README.md "TURN". The config
  # denies every private, loopback and link-local peer; never loosen it.
  coturn:
    # Pinned by version and digest (the digest `docker pull coturn/coturn:4.6.3` reported in CI;
    # compare with `docker buildx imagetools inspect coturn/coturn:4.6.3`).
    image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    container_name: secure-call-coturn
    restart: unless-stopped
    network_mode: host
    # The secret comes from .env (compose substitution), never from a file in the repo.
    # No env_file here: coturn must not receive the backend's other secrets.
    command:
      - '-c'
      - '/etc/coturn/turnserver.conf'
      - '--static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}'
      # Replacing the image's default command drops its external-ip detection; behind a
      # home NAT the relay must advertise the public IP: "<public-ip>/<pi-lan-ip>".
      - '--external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}'
      # Relays only on the Pi's LAN IPv4 (the second half of TURN_EXTERNAL_IP), never on IPv6.
      - '--relay-ip=${TURN_RELAY_IP:?Set TURN_RELAY_IP in .env}'
    # Docker keeps stdout on disk; keep little of it. (The secret is visible in
    # `docker inspect` and the process list on the Pi; keep the Pi's users trusted.)
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '2'
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

networks:
  internal: {}

volumes:
  pgdata:
