# Backend + PostgreSQL for the Raspberry Pi test server, behind Nginx Proxy Manager.
#
# On the Pi, in this folder:
#   cp .env.example .env      # then fill in the values marked "set"
#   docker compose up -d
# and add update.sh to cron (see README.md) so new images are picked up automatically.
#
# Network layout:
#   - The backend is published on BACKEND_PUBLISH_ADDR:BACKEND_PUBLISH_PORT (default
#     127.0.0.1:8001). Nginx Proxy Manager forwards signal.securevideocall.com there; when the
#     proxy runs on another machine, set BACKEND_PUBLISH_ADDR to this Pi's home-network IP.
#     Never forward this port on your router: only the proxy's 80 and 443 face the internet.
#   - "internal" holds the backend and PostgreSQL.
#   - PostgreSQL is published on POSTGRES_PUBLISH_ADDR:POSTGRES_PUBLISH_PORT (default
#     127.0.0.1:5434, the Pi only) for database tools. Never forward that port, 5432 or 81
#     (the proxy's admin page) on your router.
services:
  backend:
    image: ghcr.io/the-secure-video-call/secure-call-backend:main
    container_name: secure-call-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database is reached by its service name and its own port,
      # whatever port is published on the Pi.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BACKEND_PUBLISH_ADDR:-127.0.0.1}:${BACKEND_PUBLISH_PORT:-8001}:8000'
    networks:
      - internal

  postgres:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securecall}
      POSTGRES_USER: ${POSTGRES_USER:-securecall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PUBLISH_ADDR:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # TURN relay for calls across NATs (PLAN.md 3.5). Router forwards: see README.md "TURN". The
  # config denies every private, loopback and link-local peer; never loosen it.
  #
  # coturn runs on its OWN bridge network ("turn", fixed subnet inside 172.16.0.0/12, which the
  # config denies as a peer), not on the host network. coturn exempts its own addresses from the
  # deny list (two clients on one relay must reach each other's relay addresses), so on the host
  # network "its own address" would be the Pi itself, and any UDP service on the Pi would be
  # reachable from the internet with a TURN login (CI run 48e8d0b). In its own network the only
  # thing at coturn's own address is coturn. The Pi's LAN address (192.168/16, 10/8) and the
  # bridge gateway (172.16/12) are covered by the normal deny ranges.
  coturn:
    # Built from coturn/Dockerfile: the pinned upstream image (version and digest are in that
    # file) with the file capability removed from turnserver. `docker compose up -d --build coturn`.
    build: ./coturn
    image: secure-call-coturn:local
    container_name: secure-call-coturn
    restart: unless-stopped
    networks:
      turn:
        ipv4_address: 172.30.200.2
    # Published on the Pi's LAN address only, never on 0.0.0.0. The router forwards stay the same.
    ports:
      - '${TURN_RELAY_IP:?Set TURN_RELAY_IP in .env}:3478:3478/udp'
      - '${TURN_RELAY_IP:?Set TURN_RELAY_IP in .env}:3478:3478/tcp'
      - '${TURN_RELAY_IP:?Set TURN_RELAY_IP in .env}:49160-49200:49160-49200/udp'
    # Nothing coturn writes can reach the Pi's disk: read-only root filesystem, and small
    # in-memory mounts (world-writable, as coturn runs as an unprivileged user) for the
    # places it may try to write logs to. Their contents vanish when the container stops.
    read_only: true
    tmpfs:
      - /var/tmp:size=1m,mode=1777,noexec,nosuid,nodev
      - /tmp:size=1m,mode=1777,noexec,nosuid,nodev
      - /var/log:size=1m,mode=1777,noexec,nosuid,nodev
    # No capabilities at all, and no-new-privileges. The upstream image puts the file capability
    # CAP_NET_BIND_SERVICE=+ep on turnserver, which made the container need `cap_add` (CI runs
    # 42757878869, 48e8d0b: Docker grants cap_add to the non-root process too, CapEff 0x400).
    # The derived image removes that file capability, so nothing is added back. Keep these flags
    # identical to the docker run flags in coturn/test-coturn.sh.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No core dumps: a crash must not write memory (which holds the secret) to disk.
    ulimits:
      core: 0
    # Never root (65534 = nobody; the Dockerfile sets the same). Keep identical to the --user flag
    # in coturn/test-coturn.sh, which asserts that turnserver's Uid and Gid are not 0 and that
    # CapEff is 0.
    user: '65534:65534'
    # Start turnserver directly as pid 1, so no shell ever expands the secret (the Dockerfile sets
    # the same entrypoint). Found through PATH.
    entrypoint: ['turnserver']
    # The secret comes from .env (compose substitution), never from a file in the repo.
    # No env_file here: coturn must not receive the backend's other secrets.
    command:
      - '-c'
      - '/etc/coturn/turnserver.conf'
      # Logging to stdout only (discarded below). coturn reads command-line log options before
      # the config file, so no early warning can make it open a log file. Keep identical to
      # coturn/test-coturn.sh.
      - '--log-file=stdout'
      - '--no-stdout-log'
      - '--static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}'
      # Behind the home NAT (and Docker's) the relay must advertise the public IP:
      # "<public-ip>/<container address>". 172.30.200.2 is this container's fixed address.
      - '--external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP in .env}/172.30.200.2'
      # The home's public IP is also denied as a peer: defence in depth only. coturn still answers
      # CreatePermission for it with success (it exempts its own addresses), and relay-to-relay
      # through the public address works with this flag set (CI run 48e8d0b), so it breaks
      # nothing. The config file must be world-readable.
      - '--denied-peer-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP in .env}'
      # Relays only on the container's IPv4, never on IPv6.
      - '--relay-ip=172.30.200.2'
      # Listen only on the container address and loopback. Keep identical to
      # coturn/test-coturn.sh.
      - '--listening-ip=172.30.200.2'
      - '--listening-ip=127.0.0.1'
    # coturn's console output is discarded, never written to the Pi's disk: coturn prints the
    # TURN username on every failed login (for example internet scanners trying random logins),
    # and PLAN.md section 3 says usernames are never logged. To debug a coturn that will not
    # start, switch this to json-file temporarily and switch it back afterwards.
    # (The secret is visible in `docker inspect` and the process list on the Pi; keep the Pi's
    # users trusted.)
    logging:
      driver: none
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

networks:
  internal: {}
  # coturn only. A fixed small subnet inside 172.16.0.0/12 (denied as a peer by turnserver.conf),
  # no IPv6. 172.30.200.1 is the gateway (the Pi), 172.30.200.2 is coturn. Keep identical to the
  # network the test creates in coturn/test-coturn.sh.
  turn:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.200.0/29
          gateway: 172.30.200.1

volumes:
  pgdata:
