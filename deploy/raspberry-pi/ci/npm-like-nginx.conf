# CI only (.github/workflows/ci.yml): an nginx server block shaped like Nginx Proxy Manager's proxy
# host template (its proxy_host.conf and include/proxy.conf), with ../npm-advanced.conf included
# exactly where Nginx Proxy Manager puts the Advanced tab's lines (server level). It proves those
# lines make the proxy check the backend's certificate, for plain requests and WebSockets alike.
events {}

http {
  server {
    listen 127.0.0.1:18080;

    set $forward_scheme https;
    set $server "127.0.0.1";
    set $port 8001;

    include /etc/nginx/npm-advanced.conf;

    location / {
      # As Nginx Proxy Manager's include/proxy.conf, with the Host the backend accepts in CI.
      proxy_set_header Host signal.example.invalid;
      proxy_set_header X-Forwarded-Scheme $scheme;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      # Websockets Support on.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_http_version 1.1;
      proxy_pass $forward_scheme://$server:$port$request_uri;
    }
  }
}
