# CI only (.github/workflows/ci.yml): a server block built like Nginx Proxy Manager v2.16.0's proxy
# host (backend/templates/proxy_host.conf), with its real includes vendored verbatim in npm-2.16.0/
# (proxy.conf, with its add_header X-Served-By, and the ACME challenge locations) and the two maps
# from its nginx.conf that proxy.conf needs. ../npm-advanced.conf goes exactly where Nginx Proxy
# Manager puts the Advanced tab's lines: server level, after the certificate's ACME include. One
# server block listens for plain HTTP and HTTPS, as Nginx Proxy Manager's does. Not modelled: Block
# Common Exploits, HTTP/2, and OpenResty instead of nginx (same add_header and charset behaviour).
events {}

http {
  # From Nginx Proxy Manager v2.16.0's nginx.conf.
  map $http_x_forwarded_proto $x_forwarded_proto {
    "http" "http";
    "https" "https";
    default $scheme;
  }
  map $http_x_forwarded_scheme $x_forwarded_scheme {
    "http" "http";
    "https" "https";
    default $scheme;
  }

  server {
    set $forward_scheme https;
    set $server "127.0.0.1";
    set $port 8001;

    listen 127.0.0.1:18080;
    listen 127.0.0.1:18443 ssl;
    # A throwaway certificate for the front side (the real proxy has Let's Encrypt's).
    ssl_certificate /etc/nginx/front.crt;
    ssl_certificate_key /etc/nginx/front.key;

    include /etc/nginx/npm/letsencrypt-acme-challenge.conf;

    # Websockets Support on (proxy_host.conf adds these at server level and in location /).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    include /etc/nginx/npm-advanced.conf;

    location / {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_http_version 1.1;
      include /etc/nginx/npm/proxy.conf;
    }
  }
}
