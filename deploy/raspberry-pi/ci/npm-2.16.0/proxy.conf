# Verbatim from Nginx Proxy Manager v2.16.0 (MIT licence), docker/rootfs/etc/nginx/conf.d/include/proxy.conf.
# CI includes it in location / exactly as Nginx Proxy Manager does. Refresh it on every upgrade.
add_header       X-Served-By $host;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Scheme $x_forwarded_scheme;
proxy_set_header X-Forwarded-Proto  $x_forwarded_proto;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP          $remote_addr;
proxy_pass       $forward_scheme://$server:$port$request_uri;

