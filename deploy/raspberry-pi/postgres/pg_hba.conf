# Who may connect to PostgreSQL, and how (compose.yaml passes this file with -c hba_file=...).
#
# Over the network, TLS only ("hostssl"): there is no "host" line, so a plaintext connection is
# refused by the server itself, whatever the client asks for. Passwords are checked with
# SCRAM-SHA-256. The backend connects as its own role (postgres/initdb/10-app-role.sh), which is
# not a superuser; the superuser is for maintenance only.
#
# The Unix socket exists only inside the container: the image's start-up scripts and the
# healthcheck (pg_isready) use it, as does `docker compose exec postgres psql`.

# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            trust
hostssl  all       all   all      scram-sha-256
