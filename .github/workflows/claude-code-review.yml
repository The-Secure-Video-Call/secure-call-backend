# Claude automatically reviews every pull request that is ready for review
# and leaves inline comments. Draft PRs are skipped; a new push cancels the
# previous review run to save cost.
# Note: on public repos, GitHub withholds secrets from PRs opened from forks,
# so those PRs won't get an automatic review.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Runs on the maintainer's Claude subscription (token from `claude setup-token`).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Inline comments on problems, plus reading the PR and posting the summary
          # ("No issues found" or the list of findings) as one PR comment.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
          # Also review Dependabot's dependency-update PRs. GitHub doesn't give those
          # runs the normal Actions secrets, so CLAUDE_CODE_OAUTH_TOKEN must also be
          # available as a Dependabot secret.
          allowed_bots: 'dependabot[bot]'
