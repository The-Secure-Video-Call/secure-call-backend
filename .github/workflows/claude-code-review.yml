# Claude automatically reviews every pull request that is ready for review
# and leaves inline comments. Draft PRs are skipped; a new push cancels the
# previous review run to save cost.
# Note: on public repos, GitHub withholds secrets from PRs opened from forks,
# so those PRs won't get an automatic review.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Read-only copy of the other repo's latest main, so Claude can read its code like a
      # teammate on the other team would. It has no credentials and .gitignore lists
      # .reference/, so it can never be changed or committed from here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: The-Secure-Video-Call/secure-call
          path: .reference/secure-call
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # Runs on the maintainer's Claude subscription (token from `claude setup-token`).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Inline comments on problems, plus reading the PR and posting the summary
          # ("No issues found" or the list of findings) as one PR comment.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
          # Also review Dependabot's dependency-update PRs. GitHub doesn't give those
          # runs the normal Actions secrets, so CLAUDE_CODE_OAUTH_TOKEN must also be
          # available as a Dependabot secret.
          # Also review the commits Claude pushes to a PR after a follow-up comment:
          # GitHub reports those pushes as github-actions[bot].
          allowed_bots: 'dependabot[bot],github-actions[bot]'
