# CD for the backend: builds the Docker image and publishes it to GitHub's container registry,
# where the Raspberry Pi picks it up (deploy/raspberry-pi/update.sh).
#
# - Pull requests: build the image and smoke-test it (nothing is published).
# - Push to main: the same test, then, after approval in the "production" environment, build
#   for arm64 (Raspberry Pi) and amd64 and publish as :main and :sha-<commit>.
name: Publish backend image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/the-secure-video-call/secure-call-backend

jobs:
  test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: secure-call-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            secure-call-backend:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              echo; echo "healthz OK"; docker rm -f smoke > /dev/null; exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

  publish:
    if: github.event_name != 'pull_request'
    needs: test-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://signal.securevideocall.com/healthz
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # QEMU lets the amd64 runner build the arm64 image for the Pi.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (arm64 + amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
