# Lint, type-check, test, Django deploy checks and dependency audit on every pull request
# and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action pinned to a commit SHA and every image to a digest (a tag can be moved).
      - name: Actions and images are pinned
        run: python3 scripts/check_pinned_references.py

      # Python version comes from .python-version; uv installs it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The same uv as the Dockerfile (ghcr.io/astral-sh/uv:0.13.7).
          version: "0.13.7"
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .

      # A throwaway PostgreSQL started exactly as the Pi runs it (deploy/raspberry-pi/compose.yaml):
      # TLS only, with certificates from make-local-certs.sh, and the backend's own role.
      # The TURN values are only there because compose.yaml requires them; coturn isn't started.
      - name: Start PostgreSQL as the Pi runs it
        working-directory: deploy/raspberry-pi
        run: |
          ./make-local-certs.sh
          ./make-turn-secret.sh
          printf '%s\n' \
            POSTGRES_PASSWORD=ci-only-throwaway \
            POSTGRES_APP_PASSWORD=ci-only-throwaway-app \
            DJANGO_SECRET_KEY=ci-only-throwaway-secret-key-not-used-anywhere-else-0123456789 \
            DJANGO_ALLOWED_HOSTS=signal.example.invalid,127.0.0.1 \
            SIGNALING_ALLOWED_ORIGINS=https://call.example.invalid \
            TURN_PUBLIC_IP=203.0.113.7 \
            TURN_RELAY_IP=127.0.0.1 > .env
          docker compose up -d --wait postgres || { docker compose logs postgres; exit 1; }

      - name: Tests (including the real PostgreSQL connection)
        env:
          # The superuser for Django's tests (they create a test database); the backend's own
          # role for tests/test_database_tls.py.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5434'
          POSTGRES_DB: securecall
          POSTGRES_USER: securecall
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_SSLMODE: verify-full
          POSTGRES_SSLROOTCERT: ${{ github.workspace }}/deploy/raspberry-pi/tls/local-ca.crt
          POSTGRES_APP_USER: securecall_app
          POSTGRES_APP_PASSWORD: ci-only-throwaway-app
        run: uv run pytest -rs

      # This PR's own image, run through the Pi's compose.yaml (its settings, mounts and
      # hardening: read-only, no capabilities), must reach that database as the backend's own
      # role over TLS 1.3. The start-up migration ignores a failure, so check it here.
      - name: The backend image reaches the database as on the Pi
        working-directory: deploy/raspberry-pi
        run: |
          # Built under the name compose.yaml uses, so compose runs it instead of pulling.
          docker build -q -t ghcr.io/the-secure-video-call/secure-call-backend:main ../..
          backend=(docker compose run --rm --no-deps --pull never backend)
          "${backend[@]}" python manage.py migrate --noinput
          "${backend[@]}" python -c "import django; django.setup(); from django.db import connection; c = connection.cursor(); c.execute('SELECT current_user, ssl, version FROM pg_stat_ssl WHERE pid = pg_backend_pid()'); row = c.fetchone(); assert row == ('securecall_app', True, 'TLSv1.3'), row; print('The backend image reaches PostgreSQL as', row[0], 'over', row[2])"

      # The same container serving through compose.yaml (#59): HTTPS with TLS 1.3 and a
      # certificate that passes the proxy's checks (our CA, the name secure-call-backend), and no
      # answer at all to plain HTTP.
      - name: The backend serves HTTPS only, as the proxy checks it
        working-directory: deploy/raspberry-pi
        run: |
          docker compose up -d --no-deps --pull never backend
          proxy_check=(curl -fsS --max-time 5 --tlsv1.3 --cacert tls/local-ca.crt
            --resolve secure-call-backend:8001:127.0.0.1
            -H 'Host: signal.example.invalid' -H 'X-Forwarded-Proto: https'
            https://secure-call-backend:8001/healthz)
          for attempt in $(seq 1 30); do
            if health="$("${proxy_check[@]}" 2>/dev/null)"; then break; fi
            sleep 1
          done
          if [ "${health:-}" != '{"status": "ok"}' ]; then
            echo "The backend did not answer over HTTPS:"; "${proxy_check[@]}"
            docker compose logs backend | tail -n 20; exit 1
          fi
          echo "HTTPS: $health"
          if curl -sS --max-time 5 -o /dev/null http://127.0.0.1:8001/healthz; then
            echo "The backend answered plain HTTP"; exit 1
          fi
          echo "Plain HTTP gets no answer."

      # The proxy lines users paste into Nginx Proxy Manager (npm-advanced.conf), in an nginx
      # server block shaped like Nginx Proxy Manager's, in front of the real backend container:
      #   - over HTTPS the health check and a signaling WebSocket pass, each security header once;
      #   - plain HTTP gets 400 with the security headers, except the ACME challenge (#56);
      #   - TRACE gets the proxy's own 405, with the security headers (#61);
      #   - with another CA trusted, the proxy refuses the backend (502): the certificate is checked.
      - name: The proxy's lines, in front of the backend
        working-directory: deploy/raspberry-pi
        run: |
          mkdir -p "$RUNNER_TEMP/acme/.well-known/acme-challenge"
          echo 'acme challenge served' >"$RUNNER_TEMP/acme/.well-known/acme-challenge/test-token"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=front \
            -days 1 -keyout "$RUNNER_TEMP/front.key" -out "$RUNNER_TEMP/front.crt" 2>/dev/null
          run_proxy() {
            docker rm -f npm-like >/dev/null 2>&1 || true
            docker run -d --name npm-like --network host \
              -v "$PWD/ci/npm-like-nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/npm-advanced.conf:/etc/nginx/npm-advanced.conf:ro" \
              -v "$PWD/ci/npm-2.16.0:/etc/nginx/npm:ro" \
              -v "$RUNNER_TEMP/acme:/data/letsencrypt-acme-challenge:ro" \
              -v "$RUNNER_TEMP/front.crt:/etc/nginx/front.crt:ro" \
              -v "$RUNNER_TEMP/front.key:/etc/nginx/front.key:ro" \
              -v "$1:/data/secure-call/local-ca.crt:ro" \
              nginx:1.30-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311 >/dev/null
            for attempt in $(seq 1 20); do
              curl -sk -o /dev/null --max-time 2 https://127.0.0.1:18443/healthz && return 0
              sleep 0.5
            done
            docker logs npm-like; return 1
          }
          security_headers=(strict-transport-security x-content-type-options x-frame-options
            referrer-policy cross-origin-opener-policy cross-origin-resource-policy
            content-security-policy permissions-policy)
          # $1 label, $2 expected status, $3 expected Content-Type, $4 response headers: each
          # security header exactly once.
          expect_response() {
            local status_line content_type count header problems=""
            status_line="$(head -n 1 <<<"$4" | tr -d '\r')"
            content_type="$(grep -i '^content-type:' <<<"$4" | head -n 1 | cut -d' ' -f2- | tr -d '\r')"
            [[ "$status_line" =~ ^HTTP/[0-9.]+\ $2([[:space:]]|$) ]] || problems+=" status '$status_line'"
            [ "$content_type" = "$3" ] || problems+=" content-type '$content_type'"
            for header in "${security_headers[@]}"; do
              count="$(grep -ci "^$header:" <<<"$4" || true)"
              [ "$count" = 1 ] || problems+=" $header x$count"
            done
            if [ -n "$problems" ]; then echo "FAIL: $1:$problems"; echo "$4"; return 1; fi
            echo "PASS: $1 ($2, each security header once)"
          }
          run_proxy "$PWD/tls/local-ca.crt"
          health="$(curl -sk --max-time 5 https://127.0.0.1:18443/healthz)"
          [ "$health" = '{"status": "ok"}' ] || { echo "Through the proxy: $health"; docker logs npm-like; exit 1; }
          expect_response "proxied health check over HTTPS" 200 application/json \
            "$(curl -sk -D - -o /dev/null --max-time 5 https://127.0.0.1:18443/healthz)"
          uv run python ci/websocket_join.py wss://127.0.0.1:18443/ws/signal/ https://call.example.invalid
          html='text/html; charset=utf-8'
          expect_response "plain HTTP refused" 400 "$html" \
            "$(curl -s -D - -o /dev/null --max-time 5 http://127.0.0.1:18080/healthz)"
          expect_response "plain HTTP WebSocket path refused" 400 "$html" \
            "$(curl -s -D - -o /dev/null --max-time 5 http://127.0.0.1:18080/ws/signal/)"
          # The ACME exception goes by the normalised path, so a dot-segment cannot reach past it.
          expect_response "plain HTTP with ../ after the ACME path refused" 400 "$html" \
            "$(curl -s --path-as-is -D - -o /dev/null --max-time 5 http://127.0.0.1:18080/.well-known/acme-challenge/../healthz)"
          acme="$(curl -s --max-time 5 http://127.0.0.1:18080/.well-known/acme-challenge/test-token)"
          [ "$acme" = "acme challenge served" ] || { echo "FAIL: the ACME challenge over HTTP: $acme"; exit 1; }
          echo "PASS: the ACME challenge still answers over plain HTTP"
          expect_response "TRACE answered by the proxy" 405 "$html" \
            "$(curl -sk -X TRACE -D - -o /dev/null --max-time 5 https://127.0.0.1:18443/)"
          run_proxy "$RUNNER_TEMP/front.crt"   # any other CA
          expect_response "with another CA trusted, the proxy refuses the backend" 502 "$html" \
            "$(curl -sk -D - -o /dev/null --max-time 5 https://127.0.0.1:18443/healthz)"
          docker rm -f npm-like >/dev/null

      # The automatic refresh of coturn's certificate (#90), set up with README TURN step 3b's
      # commands and run by its real unit under systemd: the runner's sshd, a sudo-only account
      # and a container named like Nginx Proxy Manager's stand in for the proxy machine. A renewal
      # is installed; a wrong name and a key without its forced command are refused; the key opens
      # no shell; no key line reaches the journal.
      - name: The TURN certificate refresh (sync-turn-certificate.sh) on the runner
        working-directory: deploy/raspberry-pi
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck --severity=warning ci/test-turn-certificate-sync.sh
          else
            echo "shellcheck is not installed on this runner; skipped"
          fi
          bash ci/test-turn-certificate-sync.sh

      # firewall.sh (#63) applied on the runner for real, with the stack above: the backend reaches
      # only PostgreSQL, only the proxy reaches its published port, coturn's network reaches public
      # addresses only, neither network reaches the runner itself, coturn's TCP ports are limited
      # per address, another container is unaffected, the systemd unit re-applies after Docker
      # restarts, and --remove takes it all out. Each check runs without the firewall first.
      # Last of the Docker steps: it republishes the backend and restarts Docker.
      - name: The firewall (firewall.sh) on the runner
        working-directory: deploy/raspberry-pi
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck --severity=warning firewall.sh ci/test-firewall.sh
          else
            echo "shellcheck is not installed on this runner; skipped"
          fi
          bash ci/test-firewall.sh

      - name: Django production checks
        env:
          DJANGO_ALLOWED_HOSTS: signal.example.invalid
          SIGNALING_ALLOWED_ORIGINS: https://call.example.invalid
        run: |
          DJANGO_SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run python manage.py check --deploy --fail-level WARNING

      # The environment is exactly uv.lock (uv sync --locked above). --strict also fails when a
      # package cannot be audited, so nothing is skipped silently.
      - run: uv run pip-audit --strict

  # The hardened coturn config (deploy/raspberry-pi/coturn/) against the pinned image:
  # valid credentials allocate; wrong or expired credentials and private peers are refused.
  coturn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hardened coturn checks
        run: bash deploy/raspberry-pi/coturn/test-coturn.sh
