# Lint, type-check, test, Django deploy checks and dependency audit on every pull request
# and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action pinned to a commit SHA and every image to a digest (a tag can be moved).
      - name: Actions and images are pinned
        run: python3 scripts/check_pinned_references.py

      # Python version comes from .python-version; uv installs it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The same uv as the Dockerfile (ghcr.io/astral-sh/uv:0.13.7).
          version: "0.13.7"
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .

      # A throwaway PostgreSQL started exactly as the Pi runs it (deploy/raspberry-pi/compose.yaml):
      # TLS only, with certificates from make-local-certs.sh, and the backend's own role.
      # The TURN values are only there because compose.yaml requires them; coturn isn't started.
      - name: Start PostgreSQL as the Pi runs it
        working-directory: deploy/raspberry-pi
        run: |
          ./make-local-certs.sh
          printf '%s\n' \
            POSTGRES_PASSWORD=ci-only-throwaway \
            POSTGRES_APP_PASSWORD=ci-only-throwaway-app \
            DJANGO_SECRET_KEY=ci-only-throwaway-secret-key-not-used-anywhere-else-0123456789 \
            DJANGO_ALLOWED_HOSTS=signal.example.invalid \
            SIGNALING_ALLOWED_ORIGINS=https://call.example.invalid \
            TURN_SHARED_SECRET=ci-only-throwaway \
            TURN_PUBLIC_IP=203.0.113.7 \
            TURN_RELAY_IP=127.0.0.1 > .env
          docker compose up -d --wait postgres || { docker compose logs postgres; exit 1; }

      - name: Tests (including the real PostgreSQL connection)
        env:
          # The superuser for Django's tests (they create a test database); the backend's own
          # role for tests/test_database_tls.py.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5434'
          POSTGRES_DB: securecall
          POSTGRES_USER: securecall
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_SSLMODE: verify-full
          POSTGRES_SSLROOTCERT: ${{ github.workspace }}/deploy/raspberry-pi/tls/local-ca.crt
          POSTGRES_APP_USER: securecall_app
          POSTGRES_APP_PASSWORD: ci-only-throwaway-app
        run: uv run pytest -rs

      # This PR's own image, run through the Pi's compose.yaml (its settings, mounts and
      # hardening: read-only, no capabilities), must reach that database as the backend's own
      # role over TLS 1.3. The start-up migration ignores a failure, so check it here.
      - name: The backend image reaches the database as on the Pi
        working-directory: deploy/raspberry-pi
        run: |
          # Built under the name compose.yaml uses, so compose runs it instead of pulling.
          docker build -q -t ghcr.io/the-secure-video-call/secure-call-backend:main ../..
          backend=(docker compose run --rm --no-deps --pull never backend)
          "${backend[@]}" python manage.py migrate --noinput
          "${backend[@]}" python -c "import django; django.setup(); from django.db import connection; c = connection.cursor(); c.execute('SELECT current_user, ssl, version FROM pg_stat_ssl WHERE pid = pg_backend_pid()'); row = c.fetchone(); assert row == ('securecall_app', True, 'TLSv1.3'), row; print('The backend image reaches PostgreSQL as', row[0], 'over', row[2])"

      - name: Django production checks
        env:
          DJANGO_ALLOWED_HOSTS: signal.example.invalid
          SIGNALING_ALLOWED_ORIGINS: https://call.example.invalid
        run: |
          DJANGO_SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run python manage.py check --deploy --fail-level WARNING

      # The environment is exactly uv.lock (uv sync --locked above). --strict also fails when a
      # package cannot be audited, so nothing is skipped silently.
      - run: uv run pip-audit --strict

  # The hardened coturn config (deploy/raspberry-pi/coturn/) against the pinned image:
  # valid credentials allocate; wrong or expired credentials and private peers are refused.
  coturn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hardened coturn checks
        run: bash deploy/raspberry-pi/coturn/test-coturn.sh
