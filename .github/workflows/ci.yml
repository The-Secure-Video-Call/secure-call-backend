# Lint, type-check, test, Django deploy checks and dependency audit on every pull request
# and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway PostgreSQL so the database tests run against a real server.
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_DB: securecall
          POSTGRES_USER: securecall
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securecall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action pinned to a commit SHA and every image to a digest (a tag can be moved).
      - name: Actions and images are pinned
        run: python3 scripts/check_pinned_references.py

      # Python version comes from .python-version; uv installs it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The same uv as the Dockerfile (ghcr.io/astral-sh/uv:0.13.7).
          version: "0.13.7"
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .
      - name: Tests (including the real PostgreSQL connection)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: securecall
          POSTGRES_USER: securecall
          POSTGRES_PASSWORD: ci-only-throwaway
        run: uv run pytest -rs

      - name: Django production checks
        env:
          DJANGO_ALLOWED_HOSTS: signal.example.invalid
          SIGNALING_ALLOWED_ORIGINS: https://call.example.invalid
        run: |
          DJANGO_SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            uv run python manage.py check --deploy --fail-level WARNING

      # The environment is exactly uv.lock (uv sync --locked above). --strict also fails when a
      # package cannot be audited, so nothing is skipped silently.
      - run: uv run pip-audit --strict

  # The hardened coturn config (deploy/raspberry-pi/coturn/) against the pinned image:
  # valid credentials allocate; wrong or expired credentials and private peers are refused.
  coturn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hardened coturn checks
        run: bash deploy/raspberry-pi/coturn/test-coturn.sh
