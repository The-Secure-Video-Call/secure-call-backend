# Lets you write "@claude <request>" in an issue, PR comment or PR review.
# Claude reads the repo (including CLAUDE.md), does the work, pushes a branch,
# and replies with a link to open a pull request.
# Only people with write access to the repo can trigger it.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Read-only copy of the other repo's latest main, so Claude can read its code like a
      # teammate on the other team would. It has no credentials and .gitignore lists
      # .reference/, so it can never be changed or committed from here.
      - uses: actions/checkout@v7
        with:
          repository: The-Secure-Video-Call/secure-call
          path: .reference/secure-call
          fetch-depth: 1
          persist-credentials: false

      # uv (and through it Python 3.14) so Claude can run the project's checks.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: anthropics/claude-code-action@v1
        with:
          # Runs on the maintainer's Claude subscription (token from `claude setup-token`).
          # Console promotional API credits don't cover Claude Code / this Action.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude may run only these commands, with up to 150 turns (steps) per job:
          # - the project's checks (pytest, ruff, mypy, pip-audit, schema export, Django checks)
          # - `uv sync` without package names, so it can't add packages from the command line
          # - read-only helpers: tail/head/wc to shorten output, git status/diff/log
          claude_args: '--max-turns 150 --allowedTools "Bash(uv sync),Bash(uv sync --locked),Bash(uv run pytest:*),Bash(uv run ruff check:*),Bash(uv run ruff format:*),Bash(uv run mypy:*),Bash(uv run pip-audit:*),Bash(uv run python -m signaling.export_schema),Bash(uv run python manage.py check:*),Bash(tail:*),Bash(head:*),Bash(wc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"'
