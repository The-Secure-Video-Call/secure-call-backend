version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Base images in the Dockerfile (python, uv), pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The coturn base image, pinned by digest.
  - package-ecosystem: docker
    directory: /deploy/raspberry-pi/coturn
    schedule:
      interval: weekly
  # postgres in compose.yaml, pinned by digest. After merging a bump, update the Pi by hand
  # (see "PostgreSQL updates" in README.md): update.sh only updates the backend.
  - package-ecosystem: docker-compose
    directory: /deploy/raspberry-pi
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major needs a data migration (pg_upgrade), never a plain image bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Our own images: built by publish-image.yml and on the Pi, referenced by a moving tag.
      - dependency-name: ghcr.io/the-secure-video-call/secure-call-backend
      - dependency-name: secure-call-coturn
